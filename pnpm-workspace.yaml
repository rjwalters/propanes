packages:
  - "packages/*"

# pnpm 11+ blocks dependency lifecycle (install/postinstall) scripts by
# default. These packages compile native addons (better-sqlite3, node-pty,
# cpu-features/ssh2) or fetch a platform binary (esbuild) and need their
# scripts to run for the workspace to build/run at all.
allowBuilds:
  better-sqlite3: true
  cpu-features: true
  esbuild: true
  node-pty: true
  ssh2: true

# shell-quote comes in transitively (concurrently; gel via drizzle-kit and
# drizzle-orm) pinned below the CVE-2026-9277/CVE-2026-13311 fix.
overrides:
  shell-quote: ^1.9.0
